<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Release Notes</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7fb;
      --surface: rgba(255, 255, 255, .94);
      --surface-muted: #eef3f8;
      --text: #172333;
      --muted: #6d7d91;
      --border: rgba(45, 75, 108, .16);
      --accent: #426b9c;
      --accent-strong: #2f5889;
      --accent-soft: #e2edf9;
      --green: #2e8b71;
      --green-soft: #e4f4ee;
      --amber: #ad6a24;
      --amber-soft: #fff0dc;
      --red: #a75758;
      --red-soft: #f8e7e7;
      --shadow: 0 22px 70px rgba(25, 49, 80, .16);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111821;
        --surface: rgba(28, 38, 51, .96);
        --surface-muted: #1c2938;
        --text: #edf4fb;
        --muted: #9cacbf;
        --border: rgba(180, 204, 231, .16);
        --accent: #8fb5df;
        --accent-strong: #b9d5f4;
        --accent-soft: #253a52;
        --green: #7bd3b4;
        --green-soft: #1d3a34;
        --amber: #f0b36f;
        --amber-soft: #42321e;
        --red: #eea4a4;
        --red-soft: #42272b;
        --shadow: 0 22px 70px rgba(0, 0, 0, .34);
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 92% 0%, rgba(92, 143, 202, .14), transparent 34%),
        var(--bg);
      color: var(--text);
      font: 14px/1.55 "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button, a { font: inherit; }
    button { color: inherit; }
    .app-shell { display: flex; flex-direction: column; height: 100%; }
    .topbar {
      padding: 28px 34px 22px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(255,255,255,.48), transparent);
    }
    .topbar-row, .title-row, .footer-row, .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 28px; letter-spacing: -.03em; }
    h2 { font-size: 18px; letter-spacing: -.015em; }
    h3 { font-size: 15px; }
    .subtitle { margin-top: 6px; color: var(--muted); }
    .version-badge, .type-badge, .source-badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-muted);
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .version-badge { border-color: rgba(66, 107, 156, .3); background: var(--accent-soft); }
    .meta-line { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 16px; color: var(--muted); font-size: 12px; }
    .meta-dot { opacity: .55; }
    .toolbar { display: flex; gap: 8px; margin-top: 18px; }
    .tab-button, .history-item, .icon-button, .button {
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
    }
    .tab-button {
      padding: 7px 12px;
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .tab-button:hover, .tab-button.active { border-color: rgba(66, 107, 156, .42); background: var(--accent-soft); color: var(--accent-strong); }
    .body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 255px;
      flex: 1;
      min-height: 0;
    }
    .content { overflow: auto; padding: 30px 34px 34px; }
    .content-inner { max-width: 780px; margin: 0 auto; }
    .history {
      overflow: auto;
      padding: 24px 18px;
      border-left: 1px solid var(--border);
      background: rgba(255,255,255,.17);
    }
    .history-header { margin-bottom: 12px; }
    .history-title { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .history-count { color: var(--muted); font-size: 11px; }
    .history-list { display: grid; gap: 8px; }
    .history-item {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      text-align: left;
    }
    .history-item:hover, .history-item.active { border-color: rgba(66, 107, 156, .42); background: var(--accent-soft); transform: translateY(-1px); }
    .history-version { display: block; font-weight: 700; }
    .history-date { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .history-type { display: inline-block; margin-top: 7px; color: var(--muted); font-size: 10px; }
    .update-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 26px;
      padding: 16px 18px;
      border: 1px solid rgba(66, 107, 156, .28);
      border-radius: 14px;
      background: var(--accent-soft);
    }
    .update-banner strong { display: block; font-size: 14px; }
    .update-banner p { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .release-summary {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }
    .release-summary .summary-copy { color: var(--muted); }
    .release-summary .summary-copy p { margin-top: 6px; }
    .section {
      margin-top: 20px;
      padding: 19px 20px 17px;
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 5px 18px rgba(25, 49, 80, .04);
    }
    .section.features { border-left-color: var(--green); }
    .section.improvements { border-left-color: var(--amber); }
    .section.fixes { border-left-color: var(--red); }
    .section.breaking { border-left-color: var(--accent); }
    .section-heading { display: flex; align-items: center; gap: 9px; }
    .section-icon { color: var(--accent-strong); font-size: 15px; font-weight: 800; }
    .features .section-icon { color: var(--green); }
    .improvements .section-icon { color: var(--amber); }
    .fixes .section-icon { color: var(--red); }
    .section-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .section ul { display: grid; gap: 9px; margin: 14px 0 0; padding-left: 20px; }
    .section li { padding-left: 3px; }
    .section li::marker { color: var(--muted); }
    code {
      padding: 1px 5px;
      border-radius: 5px;
      background: var(--surface-muted);
      font-family: Consolas, monospace;
      font-size: .92em;
    }
    a { color: var(--accent-strong); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty-state, .offline-note, .component-card {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }
    .empty-state { color: var(--muted); }
    .offline-note { margin-top: 20px; color: var(--muted); font-size: 12px; }
    .component-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
    .component-card dt { color: var(--muted); font-size: 11px; }
    .component-card dd { margin: 5px 0 0; overflow-wrap: anywhere; font-weight: 700; }
    .component-card dd.commit { font-family: Consolas, monospace; font-size: 12px; }
    .footer {
      padding: 15px 34px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .footer-note { color: var(--muted); font-size: 11px; }
    .footer-actions { display: flex; align-items: center; gap: 8px; }
    .button { padding: 8px 13px; border-radius: 8px; font-size: 12px; font-weight: 700; }
    .button:hover { border-color: rgba(66, 107, 156, .44); background: var(--accent-soft); }
    .button.primary { border-color: var(--accent-strong); background: var(--accent-strong); color: white; }
    .button.primary:hover { background: var(--accent); }
    .button:disabled { cursor: default; opacity: .6; transform: none; }
    .icon-button { width: 28px; height: 28px; padding: 0; border-radius: 50%; font-size: 17px; line-height: 1; }
    .update-status { color: var(--muted); font-size: 12px; }

    .compact {
      background: transparent;
      overflow: hidden;
    }
    .compact .app-shell { padding: 10px; }
    .whats-new-card {
      position: relative;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .compact .icon-button { position: absolute; top: 12px; right: 12px; background: transparent; border: 0; }
    .whats-new-card .eyebrow { color: var(--accent-strong); }
    .whats-new-card h1 { padding-right: 28px; font-size: 20px; }
    .whats-new-card p { margin-top: 8px; color: var(--muted); font-size: 12px; }
    .whats-new-card .button { margin-top: 18px; }
    .fade-in { animation: fade-in .2s ease-out; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (max-width: 760px) {
      .body { grid-template-columns: 1fr; }
      .history { display: none; }
      .topbar, .content, .footer { padding-left: 20px; padding-right: 20px; }
      .component-grid { grid-template-columns: 1fr; }
      .update-banner, .footer-row { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (() => {
      const api = window.deepSeekReleaseNotes
      const app = document.getElementById('app')
      let data
      let selectedVersion
      let updateState = ''

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;')
      }

      function formatDate(value) {
        if (!value) return 'Date unavailable'
        const date = new Date(value)
        if (Number.isNaN(date.getTime())) return escapeHtml(value)
        return new Intl.DateTimeFormat(undefined, { year: 'numeric', month: 'short', day: 'numeric' }).format(date)
      }

      function inlineMarkdown(value) {
        let text = escapeHtml(value)
        const tick = String.fromCharCode(96)
        text = text.replace(new RegExp(tick + '([^' + tick + ']+)' + tick, 'g'), '<code>$1</code>')
        text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        text = text.replace(/__([^_]+)__/g, '<strong>$1</strong>')
        text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, label, url) => (
          '<a href="' + escapeHtml(url) + '" data-action="open-url" data-url="' + escapeHtml(url) + '">' + label + '</a>'
        ))
        return text
      }

      function releaseFor(version) {
        return (data.history || []).find(item => item.version === version)
          || data.currentRelease
          || data.latestRelease
      }

      function releaseSections(release) {
        if (release && Array.isArray(release.sections) && release.sections.length > 0) return release.sections
        if (release && release.body) return [{ key: 'other', label: 'Other', labelZh: '其他', icon: '•', title: 'Release notes', items: [release.body] }]
        return []
      }

      function renderSections(release) {
        const sections = releaseSections(release)
        if (sections.length === 0) {
          return '<div class="empty-state">No detailed release notes are available for this version.</div>'
        }
        return sections.map(section => (
          '<section class="section ' + escapeHtml(section.key || 'other') + ' fade-in">' +
            '<div class="section-heading">' +
              '<span class="section-icon">' + escapeHtml(section.icon || '•') + '</span>' +
              '<div><h3>' + inlineMarkdown(section.title || section.label || 'Release notes') + '</h3>' +
              '<div class="section-label">' + escapeHtml(section.labelZh || section.label || 'Other') + '</div></div>' +
            '</div>' +
            '<ul>' + section.items.map(item => '<li>' + inlineMarkdown(item) + '</li>').join('') + '</ul>' +
          '</section>'
        )).join('')
      }

      function renderHistory() {
        const history = data.history || []
        if (history.length === 0) return '<div class="empty-state">No release history is cached yet.</div>'
        return history.map(release => (
          '<button class="history-item ' + (release.version === selectedVersion ? 'active' : '') + '" data-action="select-release" data-version="' + escapeHtml(release.version) + '">' +
            '<span class="history-version">v' + escapeHtml(release.version) + '</span>' +
            '<span class="history-date">' + formatDate(release.publishedAt) + '</span>' +
            '<span class="history-type">' + escapeHtml(release.releaseType || 'Patch') + '</span>' +
          '</button>'
        )).join('')
      }

      function renderComponents() {
        const info = data.localInfo || {}
        return '<div class="component-grid">' +
          '<dl class="component-card"><dt>Distribution</dt><dd>v' + escapeHtml(info.distributionVersion || 'unknown') + '</dd></dl>' +
          '<dl class="component-card"><dt>Desktop shell</dt><dd>v' + escapeHtml(info.desktopVersion || 'unknown') + '</dd></dl>' +
          '<dl class="component-card"><dt>Kernel</dt><dd>v' + escapeHtml(info.kernelVersion || 'unknown') + '</dd></dl>' +
          '<dl class="component-card"><dt>Kernel Git commit</dt><dd class="commit">' + escapeHtml(info.kernelCommit || 'unknown') + '</dd></dl>' +
        '</div>'
      }

      function renderCompact() {
        document.body.className = 'compact'
        const release = data.currentRelease || {}
        app.innerHTML =
          '<main class="app-shell">' +
            '<section class="whats-new-card fade-in">' +
              '<button class="icon-button" data-action="close" aria-label="Dismiss">×</button>' +
              '<p class="eyebrow">DeepSeek Harness</p>' +
              '<h1>Updated to v' + escapeHtml(data.currentVersion || release.version || 'unknown') + '</h1>' +
              '<p>已成功更新。查看新功能、优化与问题修复。</p>' +
              '<button class="button primary" data-action="open-notes">View what’s new / 查看新特性</button>' +
            '</section>' +
          '</main>'
      }

      function renderFull() {
        document.body.className = ''
        const release = releaseFor(selectedVersion)
        const isAbout = data.mode === 'about'
        const update = data.latestRelease
        const updateBanner = data.updateAvailable && update
          ? '<div class="update-banner">' +
              '<div><strong>v' + escapeHtml(update.version) + ' is available / 有新版本可用</strong>' +
              '<p>当前版本 v' + escapeHtml(data.currentVersion || 'unknown') + ' · ' + escapeHtml(update.channel || 'Portable Windows release') + '</p></div>' +
              '<button class="button primary" data-action="update">' + (updateState || '🚀 Update now / 立即更新') + '</button>' +
            '</div>'
          : ''
        const sourceNote = data.offline
          ? '<div class="offline-note">Offline fallback: showing the bundled or cached release notes. 网络不可用，当前显示本地/缓存内容。</div>'
          : '<div class="offline-note">Release notes are fetched from the release service and cached for offline viewing.</div>'

        app.innerHTML =
          '<main class="app-shell">' +
            '<header class="topbar">' +
              '<div class="topbar-row"><div><p class="eyebrow">DeepSeek Harness</p><h1>' + (isAbout ? 'About' : 'Release Notes') + '</h1>' +
                '<p class="subtitle">' + (isAbout ? 'Component versions and runtime identity' : '版本发布说明与历史记录') + '</p></div>' +
                '<button class="icon-button" data-action="close" aria-label="Close">×</button></div>' +
              '<div class="toolbar">' +
                '<button class="tab-button ' + (!isAbout ? 'active' : '') + '" data-action="show-notes">Release notes / 更新日志</button>' +
                '<button class="tab-button ' + (isAbout ? 'active' : '') + '" data-action="show-about">About / 关于</button>' +
              '</div>' +
            '</header>' +
            '<div class="body">' +
              '<section class="content"><div class="content-inner">' +
                (isAbout
                  ? '<div class="release-summary"><div class="summary-copy"><h2>DeepSeek Harness</h2><p>Desktop shell, distribution and kernel identity for this installation.</p></div><span class="version-badge">v' + escapeHtml(data.currentVersion || 'unknown') + '</span></div>' +
                    renderComponents() +
                    '<div class="offline-note">GitHub release history remains available from the Release notes tab.</div>'
                  : updateBanner +
                    '<div class="release-summary"><div class="summary-copy"><h2>v' + escapeHtml((release && release.version) || 'unknown') + '</h2><p>' + escapeHtml((release && release.name) || 'DeepSeek Harness release') + '</p></div>' +
                      '<div class="meta-line"><span class="version-badge">v' + escapeHtml((release && release.version) || 'unknown') + '</span><span class="type-badge">' + escapeHtml((release && release.releaseType) || 'Patch') + '</span><span>' + formatDate(release && release.publishedAt) + '</span></div></div>' +
                    renderSections(release) + sourceNote) +
              '</div></section>' +
              '<aside class="history"><div class="history-header"><span class="history-title">History / 历史</span><span class="history-count">' + (data.history || []).length + '</span></div><div class="history-list">' + renderHistory() + '</div></aside>' +
            '</div>' +
            '<footer class="footer"><div class="footer-row">' +
              '<span class="footer-note">' + (data.mode === 'update' ? 'Sessions and preferences are kept during the portable update.' : 'External links open in your system browser.') + '</span>' +
              '<div class="footer-actions">' +
                (data.mode === 'update' ? '<button class="button" data-action="close">Later / 稍后提醒</button>' : '') +
                '<button class="button" data-action="open-github">Open GitHub / 浏览器打开</button>' +
                (data.updateAvailable && update ? '<button class="button primary" data-action="update">' + (updateState || '🚀 Update now / 立即更新') + '</button>' : '') +
              '</div>' +
            '</div></footer>' +
          '</main>'
      }

      function render() {
        if (!data) return
        if (data.mode === 'whats-new') {
          renderCompact()
          return
        }
        if (!selectedVersion) selectedVersion = data.selectedVersion || (data.currentRelease && data.currentRelease.version) || (data.latestRelease && data.latestRelease.version)
        renderFull()
      }

      function refresh() {
        api.getData().then(next => {
          data = next
          selectedVersion = next.selectedVersion
          updateState = ''
          render()
        }).catch(error => {
          app.innerHTML = '<div class="empty-state" style="margin:24px">Unable to load release notes: ' + escapeHtml(error && error.message) + '</div>'
        })
      }

      document.addEventListener('click', event => {
        const target = event.target.closest('[data-action]')
        if (!target) return
        event.preventDefault()
        const action = target.dataset.action
        if (action === 'select-release') {
          selectedVersion = target.dataset.version
          render()
          return
        }
        if (action === 'show-about') {
          api.sendAction({ type: 'show-about' })
          return
        }
        if (action === 'show-notes') {
          api.sendAction({ type: 'show-notes' })
          return
        }
        if (action === 'open-github') {
          const release = releaseFor(selectedVersion) || data.latestRelease
          api.sendAction({ type: 'open-url', url: release && release.releaseUrl })
          return
        }
        if (action === 'open-url') {
          api.sendAction({ type: 'open-url', url: target.dataset.url })
          return
        }
        if (action === 'update') {
          updateState = 'Starting updater… / 正在启动更新…'
          render()
          api.sendAction({ type: 'update' })
          return
        }
        if (action === 'open-notes') {
          api.sendAction({ type: 'open-notes' })
          return
        }
        if (action === 'close') {
          api.sendAction({ type: 'close' })
        }
      })

      api.onReload(refresh)
      api.onUpdateState(state => {
        updateState = state && state.label ? state.label : ''
        render()
      })
      refresh()
    })()
  </script>
</body>
</html>
