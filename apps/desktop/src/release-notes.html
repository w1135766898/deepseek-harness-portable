<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>DeepSeek Harness Updates</title>
  <style>
    /* ─── Light Mode Default (Apple/Linear Crisp Clean Light) ─── */
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --surface: rgba(255, 255, 255, 0.92);
      --surface-glass: rgba(255, 255, 255, 0.84);
      --surface-elevated: #f1f5f9;
      --surface-hover: #e2e8f0;
      --text: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
      --border: rgba(15, 23, 42, 0.08);
      --border-focus: rgba(15, 23, 42, 0.16);
      --border-glass: rgba(255, 255, 255, 0.9);
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.08);
      --accent-border: rgba(37, 99, 235, 0.2);
      --green: #059669;
      --green-soft: rgba(5, 150, 105, 0.08);
      --amber: #d97706;
      --amber-soft: rgba(217, 119, 6, 0.08);
      --red: #e11d48;
      --red-soft: rgba(225, 29, 72, 0.08);
      --shadow-glass: 0 16px 36px -4px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.05);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    /* ─── Dark Mode (Deep Obsidian Glass) ─── */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d14;
        --surface: rgba(15, 21, 35, 0.94);
        --surface-glass: rgba(15, 21, 35, 0.86);
        --surface-elevated: #151d30;
        --surface-hover: #1c263d;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --text-dim: #4b586e;
        --border: rgba(255, 255, 255, 0.08);
        --border-focus: rgba(255, 255, 255, 0.18);
        --border-glass: rgba(255, 255, 255, 0.12);
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-soft: rgba(59, 130, 246, 0.14);
        --accent-border: rgba(59, 130, 246, 0.3);
        --green: #10b981;
        --green-soft: rgba(16, 185, 129, 0.14);
        --amber: #f59e0b;
        --amber-soft: rgba(245, 158, 11, 0.14);
        --red: #f43f5e;
        --red-soft: rgba(244, 63, 94, 0.14);
        --shadow-glass: 0 20px 48px -4px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.6;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── HUD Floating Toast (Light & Dark Reactive Glass) ─── */
    .compact { background: transparent; }
    .compact .hud-wrapper {
      padding: 8px 12px;
      height: 100%;
      display: flex;
      align-items: center;
    }
    .hud-card {
      width: 100%;
      background: var(--surface-glass);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: var(--shadow-glass);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      animation: popIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      from { transform: translateY(10px) scale(0.96); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .hud-lead {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .hud-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #1d4ed8);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 2px 6px var(--accent-soft);
    }
    .hud-texts { min-width: 0; }
    .hud-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hud-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hud-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* ─── Main App Shell (Raycast Minimalist) ─── */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--bg);
    }

    /* ─── Header ─── */
    .header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(20px);
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
    }
    .app-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .app-ver-tag {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      background: var(--surface-elevated);
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ─── Action Banner for New Update ─── */
    .top-action-bar {
      margin: 16px 24px 0;
      padding: 12px 18px;
      border-radius: 12px;
      background: var(--surface-glass);
      border: 1px solid var(--accent-border);
      box-shadow: 0 4px 16px -2px var(--accent-soft);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .action-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pulse-dot {
      position: relative;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
    .pulse-dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.5;
      animation: ripple 2s infinite ease-out;
    }
    @keyframes ripple {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    .action-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .action-sub {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* ─── Timeline Feed ─── */
    .feed {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px 48px;
    }
    .timeline {
      position: relative;
      padding-left: 20px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 4px;
      top: 12px;
      bottom: 12px;
      width: 1px;
      background: var(--border);
    }

    .release-entry {
      position: relative;
      margin-bottom: 34px;
    }
    .release-entry:last-child {
      margin-bottom: 0;
    }
    .release-node {
      position: absolute;
      left: -20px;
      top: 5px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--surface-elevated);
      border: 2px solid var(--border-focus);
      transition: all 0.2s;
    }
    .release-entry.is-current .release-node {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .release-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .ver-badge {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      font-family: var(--font-mono);
    }
    .type-pill {
      font-size: 10.5px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .type-major { color: var(--green); background: var(--green-soft); }
    .type-minor { color: var(--accent); background: var(--accent-soft); }
    .type-patch { color: var(--text-muted); background: var(--surface-elevated); }

    .release-time {
      font-size: 11.5px;
      color: var(--text-dim);
      margin-left: auto;
    }

    /* ─── Atomic Item Rows ─── */
    .entry-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.55;
    }
    .item-icon {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 5px;
      flex-shrink: 0;
      line-height: 1.2;
      user-select: none;
    }
    .item-icon.features { color: var(--green); background: var(--green-soft); }
    .item-icon.improvements { color: var(--amber); background: var(--amber-soft); }
    .item-icon.fixes { color: var(--red); background: var(--red-soft); }
    .item-icon.other { color: var(--text-muted); background: var(--surface-elevated); }

    .item-content {
      flex: 1;
      color: var(--text);
    }
    .item-content code {
      font-family: var(--font-mono);
      font-size: 11.5px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
    }

    /* ─── Footer ─── */
    .footer {
      padding: 12px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .meta-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11.5px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }
    .meta-item { display: flex; align-items: center; gap: 4px; }
    .meta-item span { color: var(--text-muted); font-weight: 500; }

    /* ─── Buttons ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 13px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
    }
    .btn:hover {
      background: var(--surface-hover);
      border-color: var(--border-focus);
    }
    .btn:disabled {
      opacity: 0.65;
      cursor: default;
      pointer-events: none;
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 1px 6px var(--accent-soft);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--text-muted);
    }
    .btn-ghost:hover {
      background: var(--surface-hover);
      color: var(--text);
    }
    .btn-icon-only {
      padding: 6px;
      border-radius: 6px;
    }
    .status-strip {
      margin: 12px 24px 0;
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
    }
    .status-strip.failed {
      color: var(--red);
      border-color: var(--red-soft);
      background: var(--red-soft);
    }
    .status-strip.interrupted {
      color: var(--amber);
      border-color: var(--amber-soft);
      background: var(--amber-soft);
    }
    .status-strip-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (() => {
      const api = window.deepSeekReleaseNotes
      const app = document.getElementById('app')
      let data
      let updateState = ''
      let updateRequested = false

      function escapeHtml(val) {
        return String(val == null ? '' : val)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;')
      }

      function formatDate(val) {
        if (!val) return ''
        const d = new Date(val)
        if (Number.isNaN(d.getTime())) return escapeHtml(val)
        return new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', year: 'numeric' }).format(d)
      }

      function inlineMarkdown(val) {
        let txt = escapeHtml(val)
        const tick = String.fromCharCode(96)
        txt = txt.replace(new RegExp(tick + '([^' + tick + ']+)' + tick, 'g'), '<code>$1</code>')
        txt = txt.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        txt = txt.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, lbl, u) => (
          '<a href="' + escapeHtml(u) + '" data-action="open-url" data-url="' + escapeHtml(u) + '" style="color:var(--accent); text-decoration:none;">' + lbl + '</a>'
        ))
        return txt
      }

      const WHALE_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12c0-3.8 3.2-7 7.5-7 4.8 0 8.5 3.2 11.5 1.5 0 2.8-1.8 4.8-3.5 5.8 2.2 1.5 4.5 1.5 5 4.2-1.8.5-4 0-6.2-1.5-2.2 3.2-6 4.2-9.3 3-4-1.2-5-4.2-5-6z" fill="currentColor"/><circle cx="6.5" cy="10.5" r="1.1" fill="#ffffff"/></svg>'

      function isUpdateBusy(status) {
        return updateRequested || Boolean(status && ['starting', 'checking', 'downloading', 'verifying', 'extracting', 'replacing'].includes(status.state))
      }

      function renderStatusStrip(status) {
        if (!status || (status.state !== 'failed' && status.state !== 'interrupted')) return ''
        const interrupted = status.state === 'interrupted'
        const title = interrupted ? '上次更新未完成' : '更新失败'
        const detail = status.message || (interrupted ? '当前安装仍可使用，请重新检查更新。' : '请重新检查更新。')
        return '<div class="status-strip ' + (interrupted ? 'interrupted' : 'failed') + '">' +
          '<span class="status-strip-text">' + title + ' · ' + escapeHtml(detail) + '</span>' +
          '<button class="btn btn-ghost" data-action="retry-update">重新检查</button>' +
        '</div>'
      }

      function renderHUD() {
        document.body.className = 'compact'
        const currentVer = data.currentVersion || (data.currentRelease && data.currentRelease.version) || '1.0.1'
        const status = data.updateStatus || {}
        const targetVer = status.targetVersion || currentVer
        const isFailed = status.state === 'failed'
        const isInterrupted = status.state === 'interrupted'
        const title = isFailed
          ? '更新失败'
          : (isInterrupted ? '上次更新未完成' : '已更新至 v' + targetVer)
        const desc = isFailed || isInterrupted
          ? (status.message || '当前安装仍可使用 · 点击重新检查更新')
          : '更新完成 · 点击查看新特性'
        const action = isFailed || isInterrupted
          ? '<button class="btn btn-primary" data-action="retry-update">重新检查</button>'
          : '<button class="btn btn-primary" data-action="open-notes">查看特性</button>'
        app.innerHTML =
          '<div class="hud-wrapper">' +
            '<div class="hud-card">' +
              '<div class="hud-lead">' +
                '<div class="hud-icon">' + WHALE_ICON + '</div>' +
                '<div class="hud-texts">' +
                  '<div class="hud-title">' + escapeHtml(title) + '</div>' +
                  '<div class="hud-desc">' + escapeHtml(desc) + '</div>' +
                '</div>' +
              '</div>' +
              '<div class="hud-actions">' +
                action +
                '<button class="btn btn-ghost btn-icon-only" data-action="close" title="关闭">✕</button>' +
              '</div>' +
            '</div>' +
          '</div>'
      }

      function renderTimeline(releases) {
        if (!releases || releases.length === 0) {
          return '<div style="color:var(--text-dim); text-align:center; padding:40px 0;">暂无更新记录</div>'
        }
        return '<div class="timeline">' + releases.map(rel => {
          const type = (rel.releaseType || 'Patch').toLowerCase()
          const typePillClass = type === 'major' ? 'type-major' : (type === 'minor' ? 'type-minor' : 'type-patch')
          const isCurrent = rel.version === data.currentVersion
          const sections = rel.sections || []

          let itemsHtml = ''
          if (sections.length > 0) {
            itemsHtml = sections.flatMap(sec => {
              const iconClass = sec.key || 'other'
              const iconLabel = sec.key === 'features' ? '✦ 新功能' : (sec.key === 'improvements' ? '↗ 优化' : (sec.key === 'fixes' ? '✓ 修复' : '• 变更'))
              return (sec.items || []).map(item => (
                '<div class="item-row">' +
                  '<span class="item-icon ' + iconClass + '">' + iconLabel + '</span>' +
                  '<span class="item-content">' + inlineMarkdown(item) + '</span>' +
                '</div>'
              ))
            }).join('')
          } else if (rel.body) {
            itemsHtml = '<div class="item-row"><span class="item-content">' + inlineMarkdown(rel.body) + '</span></div>'
          } else {
            itemsHtml = '<div class="item-row" style="color:var(--text-dim)">常规维护与性能提升</div>'
          }

          return (
            '<div class="release-entry ' + (isCurrent ? 'is-current' : '') + '">' +
              '<div class="release-node"></div>' +
              '<div class="release-header">' +
                '<span class="ver-badge">v' + escapeHtml(rel.version) + '</span>' +
                '<span class="type-pill ' + typePillClass + '">' + escapeHtml(rel.releaseType || 'Patch') + '</span>' +
                (isCurrent ? '<span style="font-size:11px; color:var(--accent); font-weight:600;">当前安装</span>' : '') +
                '<span class="release-time">' + formatDate(rel.publishedAt) + '</span>' +
              '</div>' +
              '<div class="entry-items">' + itemsHtml + '</div>' +
            '</div>'
          )
        }).join('') + '</div>'
      }

      function renderApp() {
        document.body.className = ''
        const info = data.localInfo || {}
        const update = data.latestRelease
        const hasUpdate = data.updateAvailable && update
        const status = data.updateStatus || {}
        const updateBusy = isUpdateBusy(status)
        const updateButtonLabel = updateState || (updateBusy ? '更新进行中…' : '🚀 立即更新')
        const updateButtonDisabled = updateBusy ? ' disabled' : ''

        const topBanner = hasUpdate
          ? '<div class="top-action-bar">' +
              '<div class="action-left">' +
                '<span class="pulse-dot"></span>' +
                '<div>' +
                  '<div class="action-text">新版本 v' + escapeHtml(update.version) + ' 已发布</div>' +
                  '<div class="action-sub">将下载并校验完整便携包，随后安全退出应用完成替换</div>' +
                '</div>' +
              '</div>' +
              '<button class="btn btn-primary" data-action="update"' + updateButtonDisabled + '>' + updateButtonLabel + '</button>' +
            '</div>'
          : ''

        app.innerHTML =
          '<div class="app-shell">' +
            '<header class="header">' +
              '<div class="header-left">' +
                '<div class="app-logo">' + WHALE_ICON + '</div>' +
                '<div class="app-title">DeepSeek Harness</div>' +
                '<span class="app-ver-tag">v' + escapeHtml(data.currentVersion || '1.0.1') + '</span>' +
              '</div>' +
              '<div class="header-right">' +
                '<button class="btn btn-ghost" data-action="open-github">GitHub 仓库 ↗</button>' +
                '<button class="btn btn-ghost btn-icon-only" data-action="close" title="关闭">✕</button>' +
              '</div>' +
            '</header>' +
            topBanner +
            renderStatusStrip(status) +
            '<main class="feed">' +
              renderTimeline(data.history || [data.currentRelease].filter(Boolean)) +
            '</main>' +
            '<footer class="footer">' +
              '<div class="meta-bar">' +
                '<div class="meta-item">内核: <span>v' + escapeHtml(info.kernelVersion || 'unknown') + '</span></div>' +
                '·' +
                '<div class="meta-item">外壳: <span>v' + escapeHtml(info.desktopVersion || 'unknown') + '</span></div>' +
                '·' +
                '<div class="meta-item">提交: <span>' + escapeHtml((info.kernelCommit || 'unknown').slice(0, 7)) + '</span></div>' +
              '</div>' +
            '</footer>' +
          '</div>'
      }

      function render() {
        if (!data) return
        if (data.mode === 'whats-new') {
          renderHUD()
        } else {
          renderApp()
        }
      }

      function refresh() {
        api.getData().then(next => {
          data = next
          updateState = ''
          updateRequested = false
          render()
        }).catch(err => {
          app.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-dim)">无法加载更新说明: ' + escapeHtml(err && err.message) + '</div>'
        })
      }

      document.addEventListener('click', event => {
        const target = event.target.closest('[data-action]')
        if (!target) return
        event.preventDefault()
        const action = target.dataset.action

        if (action === 'open-notes') {
          api.sendAction({ type: 'open-notes' })
          return
        }
        if (action === 'retry-update') {
          api.sendAction({ type: 'retry-update' })
          return
        }
        if (action === 'close') {
          api.sendAction({ type: 'close' })
          return
        }
        if (action === 'open-github') {
          api.sendAction({ type: 'open-url', url: (data.currentRelease && data.currentRelease.releaseUrl) || 'https://github.com/wsnxxxs/deepseek-harness-portable' })
          return
        }
        if (action === 'open-url') {
          api.sendAction({ type: 'open-url', url: target.dataset.url })
          return
        }
        if (action === 'update') {
          if (isUpdateBusy(data && data.updateStatus)) return
          updateRequested = true
          updateState = '更新器已启动，正在安全退出应用…'
          render()
          api.sendAction({ type: 'update' })
          return
        }
      })

      api.onReload(refresh)
      api.onUpdateState(st => {
        updateState = st && st.label ? st.label : ''
        render()
      })
      refresh()
    })()
  </script>
</body>
</html>
