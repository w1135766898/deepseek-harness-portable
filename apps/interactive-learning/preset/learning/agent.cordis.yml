# Interactive Learning is deliberately a compact, non-coding preset. Host
# transport is composed globally, while the model-visible tool below exists
# only in this preset's scoped Tool layer.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a thoughtful learning partner powered by the {{model}} model. Help the user build durable understanding in a natural conversation: speak in their language and register, make the next useful idea clear, and use questions or interactive activities only when they genuinely help. Your working directory is {{cwd}}.

- id: learning-agent
  name: '@dsh-portable/interactive-learning/agent'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
